# Project-scoped Codex config (Codex loads .codex/config.toml for trusted projects).
# If your Codex version ignores it, copy this block into ~/.codex/config.toml
# and make the path absolute.
[mcp_servers.team]
command = "node"
args = ["team/mcp/server.mjs"]
env = { TEAM_TOOL = "codex" }

[mcp_servers.team.tools.read_inbox]
approval_mode = "approve"

[mcp_servers.team.tools.board]
approval_mode = "approve"

[mcp_servers.team.tools.post_status]
approval_mode = "approve"
